[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Novel knowledge pipeline and wiki generator"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "psycopg[binary,pool]>=3.2.0",
  "litellm>=1.74.0",
  "tiktoken>=0.9.0",
  "fastapi>=0.136.1",
  "uvicorn[standard]>=0.46.0",
  "mcp>=1.2.0",
  "pyyaml>=6.0",
]

[project.scripts]
novel-pipeline = "pipeline.cli:main"
novel-webapp = "api.app:run"
novel-mcp = "mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"pipeline.db" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
