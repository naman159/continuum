server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Chapter submissions can exceed nginx's default 1 MB limit.
    client_max_body_size 20m;

    # Re-resolve the service name when Compose recreates the backend container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Keep API paths (including unknown ones) out of the SPA fallback.
    # API documentation uses the same origin as the app.
    location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
