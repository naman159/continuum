[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Novel knowledge pipeline and wiki generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.1",
  "psycopg[binary,pool]>=3.2.0",
  "litellm>=1.74.0",
  "tiktoken>=0.9.0",
  "rapidfuzz>=3.14.1",
]

[project.scripts]
novel-pipeline = "pipeline:main"
novel-wiki-character = "wiki.character:main"
novel-wiki-timeline = "wiki.timeline:main"
novel-wiki-threads = "wiki.threads:main"
novel-wiki-relationships = "wiki.relationships:main"

[tool.setuptools]
py-modules = ["config", "embeddings", "main", "pipeline"]

[tool.setuptools.packages.find]
include = ["db", "db.*", "extraction", "extraction.*", "ingestion", "ingestion.*", "wiki", "wiki.*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
