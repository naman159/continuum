name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image so CREATE EXTENSION vector works without a build step.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novel_wiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/novel_wiki
      # The suite runs entirely on the deterministic mock extractor and hash
      # embeddings — no provider is contacted, so no real key is needed.
      USE_MOCK_LLM: "true"
      DEFAULT_MODEL: gemini/gemini-3.1-flash-lite
      EMBEDDING_MODEL: gemini/gemini-embedding-2
      EMBEDDING_DIMENSIONS: "768"
      GEMINI_API_KEY: not-used-by-the-mock-path
      CHUNK_SIZE: "2000"
      CHUNK_OVERLAP: "200"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --dev

      - name: Create extensions and schema
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
          psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          uv run novel-pipeline init-db

      - name: Python lint
        working-directory: backend
        run: uv run ruff check .

      - name: pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: frontend (lint, typecheck, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - run: npm run lint
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
